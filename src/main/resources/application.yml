spring:
  application:
    name: url-shortener-service

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:url_shortener}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:272088}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: UrlShortenerHikariPool

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway migrations
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# ---------------------------------------------------------------------------
# Application specific configuration
# ---------------------------------------------------------------------------
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  short-code:
    length: 7
    strategy: base62        # base62 | random
    alphabet: "23456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ" # ambiguous chars removed
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_VALUE_IN_PRODUCTION_MIN_256_BITS}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}      # 1 hour
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
      issuer: url-shortener-service
  rate-limit:
    enabled: true
    creation:
      capacity: 30          # tokens
      refill-tokens: 30
      refill-duration-seconds: 60
    redirect:
      capacity: 300
      refill-tokens: 300
      refill-duration-seconds: 60
  url-validation:
    blocked-domains:
      - malware-test.example
      - phishing-test.example
    max-url-length: 2048
    require-http-https: true
  qr-code:
    size-px: 300
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.urlshortener: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
